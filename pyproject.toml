[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-torch"
version = "0.4.0"
description = "Inspectable Silver dataset preprocessing and PyTorch input pipelines."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Silver Contributors"}]
keywords = ["pytorch", "preprocessing", "datasets", "machine-learning", "research"]
dependencies = []

[project.optional-dependencies]
pytorch = ["torch>=1.9.0"]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/adfgdartec/silver-torch"
Repository = "https://github.com/adfgdartec/silver-torch"
Issues = "https://github.com/adfgdartec/silver-torch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
